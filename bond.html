    const ERA_ORDER = [
      "Sean Connery Dönemi (1962–1971)",
      "George Lazenby Dönemi (1969)",
      "Roger Moore Dönemi (1973–1985)",
      "Timothy Dalton Dönemi (1987–1989)",
      "Pierce Brosnan Dönemi (1995–2002)",
      "Daniel Craig Dönemi (2006–2021)"
    ];

    const STORAGE_KEY = "bond_watch_progress_v1";
    const POSTER_CACHE_KEY = "bond_poster_cache_v1";

    let progressMap = {};
    let posterCache = {};
    let openSections = {};
    let syncTimer = null;

    document.addEventListener("DOMContentLoaded", async () => {
      loadLocalState();
      ERA_ORDER.forEach(e => { openSections[e] = true; });
      renderApp();

      if (getFirebaseEndpoint()) {
        setCloudUI("ready", "Firebase bağlı");
        await pullFromFirebase(true);
      } else {
        setCloudUI("unconfigured", "databaseUrl girilmedi (yalnızca yerel kayıt)");
      }
    });

    function getFirebaseEndpoint() {
      const base = (EMBEDDED_FIREBASE_CONFIG.databaseUrl || "").trim().replace(/\/+$/, "");
      const node = (EMBEDDED_FIREBASE_CONFIG.nodePath || "bond_progress").trim().replace(/^\/+|\/+$/g, "");
      if (!base) return "";
      return `${base}/${node}.json`;
    }

    function setCloudUI(stateType, labelText) {
      const dot = document.getElementById("cloudDot");
      const label = document.getElementById("cloudStatusLabel");
      label.textContent = labelText;
      if (stateType === "ready") {
        dot.className = "w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]";
      } else if (stateType === "syncing") {
        dot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-zinc-500";
      }
    }

    function loadLocalState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) progressMap = JSON.parse(saved) || {};
      } catch { progressMap = {}; }

      try {
        const cachedPosters = localStorage.getItem(POSTER_CACHE_KEY);
        if (cachedPosters) posterCache = JSON.parse(cachedPosters) || {};
      } catch { posterCache = {}; }
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progressMap));
    }

    function getStatus(id) {
      return progressMap[String(id)] || "unwatched";
    }

    function setStatus(id, newStatus) {
      const key = String(id);
      if (newStatus === "unwatched") delete progressMap[key];
      else progressMap[key] = newStatus;
      saveLocalState();
      renderApp();
      scheduleFirebasePush();
    }

    async function pullFromFirebase(silent = false) {
      const endpoint = getFirebaseEndpoint();
      if (!endpoint) return false;
      setCloudUI("syncing", "Firebase'den okunuyor...");

      try {
        const res = await fetch(`${endpoint}?t=${Date.now()}`, { method: "GET" });
        if (!res.ok) {
          setCloudUI("unconfigured", `Firebase okuma hatası (${res.status}) — URL veya Rules kontrol edin`);
          return false;
        }

        const data = await res.json();
        if (data && typeof data === "object") {
          const remoteProgress = data.progress && typeof data.progress === "object" ? data.progress : data;
          const cleanProgress = {};
          Object.entries(remoteProgress).forEach(([k, v]) => {
            if (v === "watched" || v === "watching") cleanProgress[String(k)] = v;
          });
          progressMap = cleanProgress;
          saveLocalState();
          renderApp();
        }

        const nowStr = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        setCloudUI("ready", `Firebase eşitlendi (${nowStr})`);
        if (!silent) showToast("Firebase'den güncel Bond listesi çekildi.");
        return true;
      } catch {
        setCloudUI("unconfigured", "Firebase bağlantı hatası");
        return false;
      }
    }

    async function pushToFirebase() {
      const endpoint = getFirebaseEndpoint();
      if (!endpoint) return false;
      setCloudUI("syncing", "Firebase'e kaydediliyor...");

      try {
        const payload = {
          updatedAt: new Date().toISOString(),
          watchedCount: Object.values(progressMap).filter(v => v === "watched").length,
          progress: progressMap
        };

        const res = await fetch(endpoint, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          setCloudUI("unconfigured", `Firebase yazma hatası (${res.status}) — Rules kontrol edin`);
          return false;
        }

        const nowStr = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        setCloudUI("ready", `Firebase'e kaydedildi (${nowStr})`);
        return true;
      } catch {
        setCloudUI("unconfigured", "Firebase kayıt hatası");
        return false;
      }
    }

    function scheduleFirebasePush() {
      if (!getFirebaseEndpoint()) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => { pushToFirebase(); }, 400);
    }

    async function manualSyncNow() {
      if (!getFirebaseEndpoint()) {
        showToast("Önce kod içindeki EMBEDDED_FIREBASE_CONFIG.databaseUrl alanını doldurun.");
        return;
      }
      const icon = document.getElementById("syncIcon");
      icon.classList.add("animate-spin");
      await pullFromFirebase(false);
      icon.classList.remove("animate-spin");
    }

    function createFallbackPosterDataUri(item) {
      const title = item.ad.length > 26 ? item.ad.slice(0, 24) + "…" : item.ad;
      const num = String(item.sira).padStart(2, "0");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1f1b10"/>
            <stop offset="100%" stop-color="#09090b"/>
          </linearGradient>
        </defs>
        <rect width="200" height="300" fill="url(#g)"/>
        <rect x="8" y="8" width="184" height="284" rx="10" fill="none" stroke="#d4af37" stroke-opacity="0.45" stroke-width="1.5"/>
        <rect x="16" y="16" width="44" height="22" rx="4" fill="#d4af37"/>
        <text x="38" y="31" fill="#09090b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">#${num}</text>
        <text x="100" y="132" fill="#d4af37" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="3">007</text>
        <text x="100" y="158" fill="#f4f4f5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">${escapeXml(title)}</text>
        <text x="100" y="184" fill="#a1a1aa" font-family="sans-serif" font-size="11" text-anchor="middle">${item.yil} • ${escapeXml(item.aktor)}</text>
      </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function escapeXml(unsafe) {
      return unsafe.replace(/[<>&'"]/g, c => ({
        "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;"
      }[c]));
    }

    async function fetchWikipediaPoster(item) {
      if (posterCache[item.orijinal_ad]) return posterCache[item.orijinal_ad];
      const wikiQueries = [
        `${item.orijinal_ad} (film)`,
        item.orijinal_ad
      ];
      for (const q of wikiQueries) {
        try {
          const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
          if (!res.ok) continue;
          const data = await res.json();
          if (data && data.thumbnail && data.thumbnail.source) {
            posterCache[item.orijinal_ad] = data.thumbnail.source;
            localStorage.setItem(POSTER_CACHE_KEY, JSON.stringify(posterCache));
            return data.thumbnail.source;
          }
        } catch {}
      }
      return null;
    }

    function renderApp() {
      updateStatsAndUpNext();
      renderSections();
    }

    function updateStatsAndUpNext() {
      const total = BOND_FILMS.length;
      let watched = 0;
      let watching = 0;

      BOND_FILMS.forEach(item => {
        const st = getStatus(item.id);
        if (st === "watched") watched++;
        else if (st === "watching") watching++;
      });

      const unwatched = total - watched - watching;
      const pct = Math.round((watched / total) * 100);

      document.getElementById("statsSummaryText").textContent =
        `${total} film | ${watched} izlendi | ${watching} izleniyor | ${unwatched} izlenmedi`;
      document.getElementById("progressPercentText").textContent = `%${pct}`;
      document.getElementById("mainProgressBar").style.width = `${pct}%`;

      const nextItem =
        BOND_FILMS.find(i => getStatus(i.id) === "watching") ||
        BOND_FILMS.find(i => getStatus(i.id) === "unwatched") ||
        BOND_FILMS[BOND_FILMS.length - 1];

      const numStr = String(nextItem.sira).padStart(2, "0");
      document.getElementById("upNextTitle").textContent = `${numStr} — ${nextItem.ad}`;
      document.getElementById("upNextMeta").textContent =
        `🤵 ${nextItem.aktor} • ${nextItem.yil} • ★ ${nextItem.imdb} IMDb`;
      document.getElementById("upNextDesc").textContent = nextItem.aciklama;

      const upPoster = document.getElementById("upNextPoster");
      upPoster.src = posterCache[nextItem.orijinal_ad] || createFallbackPosterDataUri(nextItem);
      upPoster.dataset.itemId = nextItem.id;
      if (!posterCache[nextItem.orijinal_ad]) {
        fetchWikipediaPoster(nextItem).then(url => {
          if (url && upPoster.dataset.itemId === String(nextItem.id)) upPoster.src = url;
        });
      }
    }

    function getFilteredItems() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const statusF = document.getElementById("statusFilter").value;
      const actorF = document.getElementById("actorFilter").value;

      return BOND_FILMS.filter(item => {
        const st = getStatus(item.id);
        if (statusF !== "all" && st !== statusF) return false;
        if (actorF !== "all" && item.aktor !== actorF) return false;
        if (query) {
          const hay = `${item.ad} ${item.orijinal_ad} ${item.aciklama} ${item.yil} ${item.aktor}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });
    }

    function renderSections() {
      const container = document.getElementById("sectionsContainer");
      const filtered = getFilteredItems();
      document.getElementById("filterResultInfo").textContent = `Toplam ${filtered.length} / ${BOND_FILMS.length} film gösteriliyor`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-10 text-center space-y-2">
            <p class="text-zinc-300 font-semibold">Aramanıza veya filtrelerinize uygun Bond filmi bulunamadı.</p>
            <button onclick="clearFilters()" class="px-4 py-2 rounded-xl bg-[#d4af37] text-zinc-950 text-xs font-bold cursor-pointer">
              Filtreleri Sıfırla
            </button>
          </div>`;
        return;
      }

      container.innerHTML = "";

      ERA_ORDER.forEach(eraName => {
        const allInEra = BOND_FILMS.filter(i => i.donem === eraName);
        const visibleInEra = filtered.filter(i => i.donem === eraName);
        if (visibleInEra.length === 0) return;

        const watchedInEra = allInEra.filter(i => getStatus(i.id) === "watched").length;
        const eraPct = Math.round((watchedInEra / allInEra.length) * 100);
        const isOpen = openSections[eraName] !== false;

        const sectionEl = document.createElement("div");
        sectionEl.className = "rounded-2xl border border-zinc-800 bg-zinc-900/40 overflow-hidden";

        sectionEl.innerHTML = `
          <button onclick="toggleSection('${eraName.replace(/'/g, "\\'")}')"
            class="w-full px-4 sm:px-5 py-3.5 bg-zinc-900/90 hover:bg-zinc-900 flex flex-wrap items-center justify-between gap-3 text-left transition cursor-pointer">
            <div class="flex items-center gap-3">
              <span class="text-xs text-zinc-400 transition-transform duration-200 ${isOpen ? "rotate-90" : ""}">▶</span>
              <h3 class="font-display text-base sm:text-lg font-bold text-white uppercase tracking-wide">${eraName}</h3>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-semibold ${watchedInEra === allInEra.length ? "text-emerald-400" : "text-zinc-300"}">
                ${watchedInEra}/${allInEra.length} izlendi
              </span>
              <div class="w-20 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full ${watchedInEra === allInEra.length ? "bg-emerald-500" : "bg-[#d4af37]"}" style="width: ${eraPct}%"></div>
              </div>
            </div>
          </button>
          <div class="${isOpen ? "block" : "hidden"} p-3 sm:p-4 space-y-2.5 border-t border-zinc-800/80">
            ${visibleInEra.map(item => renderItemCardHTML(item)).join("")}
          </div>
        `;

        container.appendChild(sectionEl);
      });

      visiblePosterHydration(filtered);
    }

    function renderItemCardHTML(item) {
      const st = getStatus(item.id);
      const numStr = String(item.sira).padStart(2, "0");
      const cardClass = st === "watched" ? "card-watched" : st === "watching" ? "card-watching" : "card-unwatched";
      const posterSrc = posterCache[item.orijinal_ad] || createFallbackPosterDataUri(item);
      const imdbUrl = `https://www.imdb.com/title/${item.imdb_id}/`;

      return `
        <div id="item-card-${item.id}" class="${cardClass} rounded-xl border p-3 sm:p-3.5 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="flex items-start sm:items-center gap-3.5 min-w-0">
            <div class="relative shrink-0">
              <img id="poster-${item.id}" src="${posterSrc}" alt="${item.ad}" loading="lazy"
                class="w-12 h-[72px] sm:w-14 sm:h-[84px] rounded-lg object-cover border border-zinc-700/80 bg-zinc-950" />
              <span class="absolute -top-1.5 -left-1.5 px-1.5 py-0.5 rounded bg-zinc-950 border border-zinc-700 text-[10px] font-bold text-zinc-200">
                ${numStr}
              </span>
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-bold text-sm sm:text-base text-white leading-snug ${st === "watched" ? "line-through decoration-emerald-500/60 text-zinc-300" : ""}">
                  ${numStr} — ${item.ad}
                </span>
                ${st === "watched" ? `<span class="px-1.5 py-0.5 rounded bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-[10px] font-semibold">✓ İzlendi</span>` : ""}
              </div>

              <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-zinc-400 mt-1">
                <span>🤵 ${item.aktor}</span>
                <span>•</span>
                <span>${item.yil}</span>
                <span>•</span>
                <span class="text-zinc-400 italic">${item.orijinal_ad}</span>
                <span>•</span>
                <span class="inline-flex items-center gap-1 text-amber-400 font-semibold">★ ${item.imdb}</span>
                <a href="${imdbUrl}" target="_blank" rel="noopener noreferrer"
                  class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-[11px] font-bold transition">
                  IMDb ↗
                </a>
              </div>

              <p class="text-xs text-zinc-400 mt-1.5 line-clamp-2">${item.aciklama}</p>
            </div>
          </div>

          <div class="flex items-center justify-end gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-zinc-800/70">
            <select onchange="setStatus(${item.id}, this.value)" aria-label="İzleme durumu"
              class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition cursor-pointer focus:outline-none ${getSelectStyle(st)}">
              <option value="unwatched" ${st === "unwatched" ? "selected" : ""}>🔴 İzlenmedi</option>
              <option value="watching" ${st === "watching" ? "selected" : ""}>🟡 İzleniyor</option>
              <option value="watched" ${st === "watched" ? "selected" : ""}>🟢 İzlendi</option>
            </select>
          </div>
        </div>
      `;
    }

    function getSelectStyle(status) {
      if (status === "watched") return "bg-emerald-950/70 border-emerald-700/70 text-emerald-300";
      if (status === "watching") return "bg-amber-950/70 border-amber-700/70 text-amber-300";
      return "bg-zinc-950 border-zinc-700 text-zinc-200 hover:border-zinc-500";
    }

    function visiblePosterHydration(items) {
      items.forEach(item => {
        if (!posterCache[item.orijinal_ad]) {
          fetchWikipediaPoster(item).then(url => {
            if (url) {
              const imgEl = document.getElementById(`poster-${item.id}`);
              if (imgEl) imgEl.src = url;
            }
          });
        }
      });
    }

    function toggleSection(eraName) {
      openSections[eraName] = openSections[eraName] === false ? true : false;
      renderSections();
    }

    function expandAllSections(expand) {
      ERA_ORDER.forEach(e => { openSections[e] = expand; });
      renderSections();
    }

    function applyFilters() {
      renderSections();
    }

    function clearFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("statusFilter").value = "all";
      document.getElementById("actorFilter").value = "all";
      renderSections();
    }

    function scrollToUpNext() {
      const nextItem =
        BOND_FILMS.find(i => getStatus(i.id) === "watching") ||
        BOND_FILMS.find(i => getStatus(i.id) === "unwatched") ||
        BOND_FILMS[0];

      openSections[nextItem.donem] = true;
      clearFilters();

      setTimeout(() => {
        const el = document.getElementById(`item-card-${nextItem.id}`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("ring-2", "ring-[#d4af37]");
          setTimeout(() => el.classList.remove("ring-2", "ring-[#d4af37]"), 2000);
        }
      }, 80);
    }

    function markUpNextAsWatched() {
      const nextItem =
        BOND_FILMS.find(i => getStatus(i.id) === "watching") ||
        BOND_FILMS.find(i => getStatus(i.id) === "unwatched");

      if (!nextItem) {
        showToast("Tebrikler! Tüm 25 James Bond filmi izlendi.");
        return;
      }
      setStatus(nextItem.id, "watched");
      showToast(`"${nextItem.ad}" izlendi olarak işaretlendi!`);
    }

    function resetAllProgress() {
      if (!confirm("Tüm 007 izleme ilerlemeniz sıfırlanacak ve tüm filmler 'İzlenmedi' yapılacak. Emin misiniz?")) return;
      progressMap = {};
      saveLocalState();
      renderApp();
      scheduleFirebasePush();
      showToast("Tüm izleme ilerlemesi sıfırlandı.");
    }

    function exportJSON() {
      const dataStr = JSON.stringify({
        exportedAt: new Date().toISOString(),
        progress: progressMap
      }, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `james-bond-izleme-yedek-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("007 izleme listesi JSON olarak indirildi.");
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const imported = parsed.progress || parsed;
          if (typeof imported !== "object") throw new Error("Geçersiz format");
          progressMap = imported;
          saveLocalState();
          renderApp();
          scheduleFirebasePush();
          showToast("JSON yedeği başarıyla geri yüklendi!");
        } catch {
          alert("Seçilen JSON dosyası okunamadı veya formatı hatalı.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add("hidden"), 3000);
    }
  </script>
</body>
</html>
