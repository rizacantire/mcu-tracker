    const SAGA_ORDER = [
      "Infinity Saga – Phase 1",
      "Infinity Saga – Phase 2",
      "Defenders Saga",
      "Infinity Saga – Phase 3",
      "Multiverse Saga – Phase 4",
      "Multiverse Saga – Phase 5",
      "Multiverse Saga – Phase 6",
      "Gelecek Avengers filmleri"
    ];

    const STORAGE_KEY = "mcu_watch_progress_v1";
    const POSTER_CACHE_KEY = "mcu_poster_cache_v1";

    let progressMap = {};
    let posterCache = {};
    let openSections = {};
    let cloudSha = null;
    let syncTimer = null;

    document.addEventListener("DOMContentLoaded", async () => {
      loadLocalState();
      SAGA_ORDER.forEach(s => { openSections[s] = true; });
      renderApp();

      if (hasEmbeddedCloud()) {
        setCloudUI("ready", `Bulut: ${EMBEDDED_CLOUD_CONFIG.owner}/${EMBEDDED_CLOUD_CONFIG.repo}`);
        await pullFromGitHub(true);
      } else {
        setCloudUI("unconfigured", "Bulut ayarı eksik");
      }
    });

    function hasEmbeddedCloud() {
      return Boolean(
        EMBEDDED_CLOUD_CONFIG.owner &&
        EMBEDDED_CLOUD_CONFIG.repo &&
        EMBEDDED_CLOUD_CONFIG.token
      );
    }

    function setCloudUI(stateType, labelText) {
      const dot = document.getElementById("cloudDot");
      const label = document.getElementById("cloudStatusLabel");
      label.textContent = labelText;
      if (stateType === "ready") {
        dot.className = "w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]";
      } else if (stateType === "syncing") {
        dot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-zinc-500";
      }
    }

    function loadLocalState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) progressMap = JSON.parse(saved) || {};
      } catch { progressMap = {}; }

      try {
        const cachedPosters = localStorage.getItem(POSTER_CACHE_KEY);
        if (cachedPosters) posterCache = JSON.parse(cachedPosters) || {};
      } catch { posterCache = {}; }
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progressMap));
    }

    function getStatus(id) {
      return progressMap[String(id)] || "unwatched";
    }

    function setStatus(id, newStatus) {
      const key = String(id);
      if (newStatus === "unwatched") delete progressMap[key];
      else progressMap[key] = newStatus;
      saveLocalState();
      renderApp();
      scheduleCloudPush();
    }

    function encodeBase64Unicode(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    function decodeBase64Unicode(str) {
      return decodeURIComponent(escape(atob(str.replace(/\n/g, ""))));
    }

    async function pullFromGitHub(silent = false) {
      if (!hasEmbeddedCloud()) return false;
      const { owner, repo, path, token } = EMBEDDED_CLOUD_CONFIG;
      const filePath = path || "progress.json";
      setCloudUI("syncing", "Buluttan okunuyor...");

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${filePath}?t=${Date.now()}`;
        const res = await fetch(url, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json"
          }
        });

        if (res.status === 404) {
          await pushToGitHub();
          return true;
        }
        if (!res.ok) {
          setCloudUI("unconfigured", `Bulut okuma hatası (${res.status}) — token/depo kontrol edin`);
          return false;
        }

        const data = await res.json();
        cloudSha = data.sha;
        const decoded = decodeBase64Unicode(data.content || "e30=");
        const remoteObj = JSON.parse(decoded || "{}");
        const remoteProgress = remoteObj.progress || remoteObj;

        if (remoteProgress && typeof remoteProgress === "object") {
          progressMap = remoteProgress;
          saveLocalState();
          renderApp();
        }

        const nowStr = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        setCloudUI("ready", `Eşitlendi (${nowStr})`);
        if (!silent) showToast("GitHub bulutundan güncel liste çekildi.");
        return true;
      } catch {
        setCloudUI("unconfigured", "Bulut bağlantı hatası");
        return false;
      }
    }

    async function pushToGitHub() {
      if (!hasEmbeddedCloud()) return false;
      const { owner, repo, path, token } = EMBEDDED_CLOUD_CONFIG;
      const filePath = path || "progress.json";
      setCloudUI("syncing", "Buluta kaydediliyor...");

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${filePath}`;

        if (!cloudSha) {
          const checkRes = await fetch(`${url}?t=${Date.now()}`, {
            headers: {
              "Authorization": `Bearer ${token}`,
              "Accept": "application/vnd.github+json"
            }
          });
          if (checkRes.ok) {
            const checkData = await checkRes.json();
            cloudSha = checkData.sha;
          }
        }

        const payloadObj = {
          updatedAt: new Date().toISOString(),
          watchedCount: Object.values(progressMap).filter(v => v === "watched").length,
          progress: progressMap
        };

        const body = {
          message: `MCU ilerleme güncellendi (${new Date().toLocaleString("tr-TR")})`,
          content: encodeBase64Unicode(JSON.stringify(payloadObj, null, 2))
        };
        if (cloudSha) body.sha = cloudSha;

        const res = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          if (res.status === 409) cloudSha = null;
          setCloudUI("unconfigured", `Buluta yazılamadı (${res.status})`);
          return false;
        }

        const data = await res.json();
        if (data.content && data.content.sha) cloudSha = data.content.sha;
        const nowStr = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        setCloudUI("ready", `Buluta kaydedildi (${nowStr})`);
        return true;
      } catch {
        setCloudUI("unconfigured", "Bulut kayıt hatası");
        return false;
      }
    }

    function scheduleCloudPush() {
      if (!hasEmbeddedCloud()) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => { pushToGitHub(); }, 600);
    }

    async function manualSyncNow() {
      if (!hasEmbeddedCloud()) return;
      const icon = document.getElementById("syncIcon");
      icon.classList.add("animate-spin");
      await pullFromGitHub(false);
      icon.classList.remove("animate-spin");
    }

    function createFallbackPosterDataUri(item) {
      const title = item.ad.length > 26 ? item.ad.slice(0, 24) + "…" : item.ad;
      const num = String(item.sira).padStart(2, "0");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1f1215"/>
            <stop offset="100%" stop-color="#09090b"/>
          </linearGradient>
        </defs>
        <rect width="200" height="300" fill="url(#g)"/>
        <rect x="8" y="8" width="184" height="284" rx="10" fill="none" stroke="#e62429" stroke-opacity="0.4" stroke-width="1.5"/>
        <rect x="16" y="16" width="44" height="22" rx="4" fill="#e62429"/>
        <text x="38" y="31" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">#${num}</text>
        <text x="100" y="135" fill="#e62429" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">MARVEL</text>
        <text x="100" y="160" fill="#f4f4f5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">${escapeXml(title)}</text>
        <text x="100" y="185" fill="#a1a1aa" font-family="sans-serif" font-size="11" text-anchor="middle">${item.yil} • ${item.tur}</text>
      </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function escapeXml(unsafe) {
      return unsafe.replace(/[<>&'"]/g, c => ({
        "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;"
      }[c]));
    }

    async function fetchWikipediaPoster(item) {
      if (posterCache[item.orijinal_ad]) return posterCache[item.orijinal_ad];
      const cleanTitle = item.orijinal_ad.replace(/\s*\(Season \d+\)|\s*Season \d+/gi, "").trim();
      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanTitle)}`);
        if (!res.ok) return null;
        const data = await res.json();
        if (data && data.thumbnail && data.thumbnail.source) {
          posterCache[item.orijinal_ad] = data.thumbnail.source;
          localStorage.setItem(POSTER_CACHE_KEY, JSON.stringify(posterCache));
          return data.thumbnail.source;
        }
      } catch {}
      return null;
    }

    function renderApp() {
      updateStatsAndUpNext();
      renderSections();
    }

    function updateStatsAndUpNext() {
      const total = MCU_ITEMS.length;
      let watched = 0;
      let watching = 0;

      MCU_ITEMS.forEach(item => {
        const st = getStatus(item.id);
        if (st === "watched") watched++;
        else if (st === "watching") watching++;
      });

      const unwatched = total - watched - watching;
      const pct = Math.round((watched / total) * 100);

      document.getElementById("statsSummaryText").textContent =
        `${total} yapım | ${watched} izlendi | ${watching} izleniyor | ${unwatched} izlenmedi`;
      document.getElementById("progressPercentText").textContent = `%${pct}`;
      document.getElementById("mainProgressBar").style.width = `${pct}%`;

      const nextItem =
        MCU_ITEMS.find(i => getStatus(i.id) === "watching") ||
        MCU_ITEMS.find(i => getStatus(i.id) === "unwatched") ||
        MCU_ITEMS[MCU_ITEMS.length - 1];

      const numStr = String(nextItem.sira).padStart(2, "0");
      document.getElementById("upNextTitle").textContent = `${numStr} — ${nextItem.ad}`;
      document.getElementById("upNextMeta").textContent =
        `${getTypeIcon(nextItem.tur)} ${nextItem.tur} • ${nextItem.yil} • ${nextItem.saga} • ★ ${nextItem.imdb} IMDb`;
      document.getElementById("upNextDesc").textContent = nextItem.aciklama;

      const upPoster = document.getElementById("upNextPoster");
      upPoster.src = posterCache[nextItem.orijinal_ad] || createFallbackPosterDataUri(nextItem);
      upPoster.dataset.itemId = nextItem.id;
      if (!posterCache[nextItem.orijinal_ad]) {
        fetchWikipediaPoster(nextItem).then(url => {
          if (url && upPoster.dataset.itemId === String(nextItem.id)) upPoster.src = url;
        });
      }
    }

    function getFilteredItems() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const statusF = document.getElementById("statusFilter").value;
      const typeF = document.getElementById("typeFilter").value;
      const phaseF = document.getElementById("phaseFilter").value;

      return MCU_ITEMS.filter(item => {
        const st = getStatus(item.id);
        if (statusF !== "all" && st !== statusF) return false;
        if (typeF !== "all" && item.tur !== typeF) return false;
        if (phaseF !== "all" && item.phase !== phaseF) return false;
        if (query) {
          const hay = `${item.ad} ${item.orijinal_ad} ${item.aciklama} ${item.yil} ${item.phase}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });
    }

    function renderSections() {
      const container = document.getElementById("sectionsContainer");
      const filtered = getFilteredItems();
      document.getElementById("filterResultInfo").textContent = `Toplam ${filtered.length} / ${MCU_ITEMS.length} yapım gösteriliyor`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-10 text-center space-y-2">
            <p class="text-zinc-300 font-semibold">Aramanıza veya filtrelerinize uygun yapım bulunamadı.</p>
            <button onclick="clearFilters()" class="px-4 py-2 rounded-xl bg-[#e62429] text-white text-xs font-bold cursor-pointer">
              Filtreleri Sıfırla
            </button>
          </div>`;
        return;
      }

      container.innerHTML = "";

      SAGA_ORDER.forEach(sagaName => {
        const allInSaga = MCU_ITEMS.filter(i => i.saga === sagaName);
        const visibleInSaga = filtered.filter(i => i.saga === sagaName);
        if (visibleInSaga.length === 0) return;

        const watchedInSaga = allInSaga.filter(i => getStatus(i.id) === "watched").length;
        const sagaPct = Math.round((watchedInSaga / allInSaga.length) * 100);
        const isOpen = openSections[sagaName] !== false;

        const sectionEl = document.createElement("div");
        sectionEl.className = "rounded-2xl border border-zinc-800 bg-zinc-900/40 overflow-hidden";

        sectionEl.innerHTML = `
          <button onclick="toggleSection('${sagaName.replace(/'/g, "\\'")}')"
            class="w-full px-4 sm:px-5 py-3.5 bg-zinc-900/90 hover:bg-zinc-900 flex flex-wrap items-center justify-between gap-3 text-left transition cursor-pointer">
            <div class="flex items-center gap-3">
              <span class="text-xs text-zinc-400 transition-transform duration-200 ${isOpen ? "rotate-90" : ""}">▶</span>
              <h3 class="font-display text-base sm:text-lg font-bold text-white uppercase tracking-wide">${sagaName}</h3>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-semibold ${watchedInSaga === allInSaga.length ? "text-emerald-400" : "text-zinc-300"}">
                ${watchedInSaga}/${allInSaga.length} izlendi
              </span>
              <div class="w-20 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full ${watchedInSaga === allInSaga.length ? "bg-emerald-500" : "bg-[#e62429]"}" style="width: ${sagaPct}%"></div>
              </div>
            </div>
          </button>
          <div class="${isOpen ? "block" : "hidden"} p-3 sm:p-4 space-y-2.5 border-t border-zinc-800/80">
            ${visibleInSaga.map(item => renderItemCardHTML(item)).join("")}
          </div>
        `;

        container.appendChild(sectionEl);
      });

      visiblePosterHydration(filtered);
    }

    function renderItemCardHTML(item) {
      const st = getStatus(item.id);
      const numStr = String(item.sira).padStart(2, "0");
      const cardClass = st === "watched" ? "card-watched" : st === "watching" ? "card-watching" : "card-unwatched";
      const posterSrc = posterCache[item.orijinal_ad] || createFallbackPosterDataUri(item);
      const imdbUrl = `https://www.imdb.com/title/${item.imdb_id}/`;

      return `
        <div id="item-card-${item.id}" class="${cardClass} rounded-xl border p-3 sm:p-3.5 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="flex items-start sm:items-center gap-3.5 min-w-0">
            <div class="relative shrink-0">
              <img id="poster-${item.id}" src="${posterSrc}" alt="${item.ad}" loading="lazy"
                class="w-12 h-[72px] sm:w-14 sm:h-[84px] rounded-lg object-cover border border-zinc-700/80 bg-zinc-950" />
              <span class="absolute -top-1.5 -left-1.5 px-1.5 py-0.5 rounded bg-zinc-950 border border-zinc-700 text-[10px] font-bold text-zinc-200">
                ${numStr}
              </span>
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-bold text-sm sm:text-base text-white leading-snug ${st === "watched" ? "line-through decoration-emerald-500/60 text-zinc-300" : ""}">
                  ${numStr} — ${item.ad}
                </span>
                ${st === "watched" ? `<span class="px-1.5 py-0.5 rounded bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-[10px] font-semibold">✓ İzlendi</span>` : ""}
              </div>

              <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-zinc-400 mt-1">
                <span>${getTypeIcon(item.tur)} ${item.tur}</span>
                <span>•</span>
                <span>${item.yil}</span>
                <span>•</span>
                <span class="text-zinc-300 font-medium">${item.phase}</span>
                <span>•</span>
                <span class="inline-flex items-center gap-1 text-amber-400 font-semibold">★ ${item.imdb}</span>
                <a href="${imdbUrl}" target="_blank" rel="noopener noreferrer"
                  class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-[11px] font-bold transition">
                  IMDb ↗
                </a>
              </div>

              <p class="text-xs text-zinc-400 mt-1.5 line-clamp-2">${item.aciklama}</p>
            </div>
          </div>

          <div class="flex items-center justify-end gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-zinc-800/70">
            <select onchange="setStatus(${item.id}, this.value)" aria-label="İzleme durumu"
              class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition cursor-pointer focus:outline-none ${getSelectStyle(st)}">
              <option value="unwatched" ${st === "unwatched" ? "selected" : ""}>🔴 İzlenmedi</option>
              <option value="watching" ${st === "watching" ? "selected" : ""}>🟡 İzleniyor</option>
              <option value="watched" ${st === "watched" ? "selected" : ""}>🟢 İzlendi</option>
            </select>
          </div>
        </div>
      `;
    }

    function getSelectStyle(status) {
      if (status === "watched") return "bg-emerald-950/70 border-emerald-700/70 text-emerald-300";
      if (status === "watching") return "bg-amber-950/70 border-amber-700/70 text-amber-300";
      return "bg-zinc-950 border-zinc-700 text-zinc-200 hover:border-zinc-500";
    }

    function getTypeIcon(tur) {
      if (tur === "Film") return "🎬";
      if (tur === "Dizi") return "📺";
      if (tur === "Animasyon") return "🎨";
      return "✨";
    }

    function visiblePosterHydration(items) {
      items.forEach(item => {
        if (!posterCache[item.orijinal_ad]) {
          fetchWikipediaPoster(item).then(url => {
            if (url) {
              const imgEl = document.getElementById(`poster-${item.id}`);
              if (imgEl) imgEl.src = url;
            }
          });
        }
      });
    }

    function toggleSection(sagaName) {
      openSections[sagaName] = openSections[sagaName] === false ? true : false;
      renderSections();
    }

    function expandAllSections(expand) {
      SAGA_ORDER.forEach(s => { openSections[s] = expand; });
      renderSections();
    }

    function applyFilters() {
      renderSections();
    }

    function clearFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("statusFilter").value = "all";
      document.getElementById("typeFilter").value = "all";
      document.getElementById("phaseFilter").value = "all";
      renderSections();
    }

    function scrollToUpNext() {
      const nextItem =
        MCU_ITEMS.find(i => getStatus(i.id) === "watching") ||
        MCU_ITEMS.find(i => getStatus(i.id) === "unwatched") ||
        MCU_ITEMS[0];

      openSections[nextItem.saga] = true;
      clearFilters();

      setTimeout(() => {
        const el = document.getElementById(`item-card-${nextItem.id}`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("ring-2", "ring-[#e62429]");
          setTimeout(() => el.classList.remove("ring-2", "ring-[#e62429]"), 2000);
        }
      }, 80);
    }

    function markUpNextAsWatched() {
      const nextItem =
        MCU_ITEMS.find(i => getStatus(i.id) === "watching") ||
        MCU_ITEMS.find(i => getStatus(i.id) === "unwatched");

      if (!nextItem) {
        showToast("Tebrikler! Tüm 87 yapım izlendi.");
        return;
      }
      setStatus(nextItem.id, "watched");
      showToast(`"${nextItem.ad}" izlendi olarak işaretlendi!`);
    }

    function resetAllProgress() {
      if (!confirm("Tüm izleme ilerlemeniz sıfırlanacak ve tüm yapımlar 'İzlenmedi' yapılacak. Emin misiniz?")) return;
      progressMap = {};
      saveLocalState();
      renderApp();
      scheduleCloudPush();
      showToast("Tüm izleme ilerlemesi sıfırlandı.");
    }

    function exportJSON() {
      const dataStr = JSON.stringify({
        exportedAt: new Date().toISOString(),
        progress: progressMap
      }, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `marvel-izleme-yedek-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("İzleme listesi JSON olarak indirildi.");
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const imported = parsed.progress || parsed;
          if (typeof imported !== "object") throw new Error("Geçersiz format");
          progressMap = imported;
          saveLocalState();
          renderApp();
          scheduleCloudPush();
          showToast("JSON yedeği başarıyla geri yüklendi!");
        } catch {
          alert("Seçilen JSON dosyası okunamadı veya formatı hatalı.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add("hidden"), 3000);
    }
  </script>
</body>
</html>
