<!DOCTYPE html>
<html lang="tr" class="dark">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --marvel-red: #e62429;
      --marvel-red-dark: #b81418;
      --bg-base: #09090b;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: #f4f4f5;
      background-image:
        radial-gradient(circle at 15% 0%, rgba(230, 36, 41, 0.14), transparent 35%),
        radial-gradient(circle at 85% 10%, rgba(230, 36, 41, 0.08), transparent 30%);
    }
    .font-display {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.03em;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #e62429; }
    .card-watched {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.09) 0%, rgba(18, 18, 22, 0.96) 100%);
      border-color: rgba(16, 185, 129, 0.28);
    }
    .card-watching {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.11) 0%, rgba(18, 18, 22, 0.96) 100%);
      border-color: rgba(245, 158, 11, 0.35);
    }
    .card-unwatched {
      background-color: #121216;
      border-color: #27272a;
    }
  </style>
</head>

          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button id="btnSyncNow" onclick="manualSyncNow()" title="GitHub ile Şimdi Eşitle"

            <span id="cloudDot" class="w-2 h-2 rounded-full bg-zinc-500"></span>

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />

          </button>

          <button onclick="exportJSON()" title="JSON Yedek İndir"
            class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition cursor-pointer">
            Dışa Aktar
          </button>

            class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition cursor-pointer">
            İçe Aktar
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)" />

            class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-zinc-900 hover:bg-red-950/60 border border-zinc-800 hover:border-red-800/60 text-zinc-400 hover:text-red-300 transition cursor-pointer">

      </div>

          <span>•</span>
          <button onclick="clearFilters()" class="text-[#e62429] hover:underline cursor-pointer">Filtreleri Temizle</button>
        </div>
      </div>
    </section>
